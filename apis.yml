aid: fifth-dimension
name: Fifth Dimension
description: Fifth Dimension AI is a London-based decision intelligence platform for real-assets investors
  and asset managers. Its AI co-worker, Ellie, automates document-heavy real estate workflows — deal screening,
  underwriting, due diligence, and lease and investment analysis — by reading email bodies and PDF attachments
  and returning transparent, sourced, auditable reasoning rather than black-box answers. Founded in 2023
  by Johnny Morris and Dr. Kate Jarvis, the platform integrates with existing property management, CRM,
  data room, and financial systems and preserves each fund's institutional knowledge and investment criteria.
  The company is backed by HV Capital, Seedcamp, Speedinvest and Anthemis, and raised a $26M Series A
  in 2026.
